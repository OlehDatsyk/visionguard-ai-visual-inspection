# Optional local stack with PostgreSQL. NOT TESTED: Docker was unavailable where this project was built (see TESTING.md).
# Usage: set POSTGRES_PASSWORD and SECRET_KEY in .env, then run: docker compose up --build
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: visionguard
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://visionguard:${POSTGRES_PASSWORD}@database:5432/visionguard
      CORS_ORIGINS: http://localhost:8080
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8010:8010"
    volumes:
      - files:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8010
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  database:
  files:
